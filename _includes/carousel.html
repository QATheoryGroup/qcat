{% assign number = include.number | minus: 1 %}

<div id="carousel{{ number }}" class="carousel slide carousel-dark" data-bs-ride="carousel">
  
  <!-- Indicators -->
  <div class="carousel-indicators">
    {% for img in page.carousels[number].images %}
      <button type="button" 
              data-bs-target="#carousel{{ number }}" 
              data-bs-slide-to="{{ forloop.index0 }}" 
              class="{% if forloop.first %}active{% endif %}" 
              aria-current="{% if forloop.first %}true{% endif %}" 
              aria-label="Slide {{ forloop.index }}"></button>
    {% endfor %}
  </div>

  <!-- Slides -->
  <div class="carousel-inner">
    {% for img in page.carousels[number].images %}
      <div class="carousel-item {% if forloop.first %}active{% endif %}" 
           {% if include.duration %}data-bs-interval="{{ include.duration | times: 1000 }}"{% endif %}>
        <img src="{{ img.image }}" class="d-block w-100" alt="Slide {{ forloop.index }}">
        {% if img.caption %}
          <div class="carousel-caption d-none d-md-block">
            <h5>{{ img.caption.title }}</h5>
            <p>{{ img.caption.text }}</p>
          </div>
        {% endif %}
      </div>
    {% endfor %}
  </div>

  <!-- Controls -->
  <button class="carousel-control-prev" type="button" data-bs-target="#carousel{{ number }}" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Previous</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carousel{{ number }}" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Next</span>
  </button>

</div>
