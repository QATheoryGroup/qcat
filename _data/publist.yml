- title: "Exploiting biased noise in variational quantum models"
  image: images/papers/2025_vanRossum.png
  description: We find that symmetrising noise actually degrades performance in the variational quantum algorithms whereas preserving biased or non-unital noise can help classical optimisers find better solutions.
  authors: Connor van Rossum, Sally Shrapnel, and Riddhi S. Gupta
  link:
    url: https://arxiv.org/pdf/2510.24050
    display: arXiv (2025)
  highlight: 1

- title: "Characterizing noisy quantum computation with imperfectly addressed errors"
  image: images/papers/2025_Gupta_Characterizing.png
  description: We find that the spectrum of channels representing failures in error mitigation or error correction, on average, obey matrix Chernoff inequalities. These insights can be used to define metrics to quantify the degree to which error mitigation and error correction methods fail. 
  authors: Riddhi S. Gupta, Salini Karuvade, Kerstin Beer, Laura J. Henderson, Sally Shrapnel
  link:
    url: https://arxiv.org/pdf/2508.03261
    display: arXiv (2025)
  highlight: 1

- title: "A systematic review of quantum machine learning for digital health"
  image: images/papers/2025_Gupta_Digital.png
  description: We conduct a systematic review to assess whether quantum machine learning (QML) algorithms outperform existing classical methods for clinical decisioning or health service delivery.
  authors: Riddhi S. Gupta, Carolyn E. Wood, Teyl Engstrom, Jason D. Pole & Sally Shrapnel 
  link:
    url: https://www.nature.com/articles/s41746-025-01597-z
    display: npj Digital Medicine (2025)
  highlight: 1

- title: "Quantum algorithms for causal estimands"
  image: images/papers/2025_Goel_Quantum.png
  description:  We consider a recently developed family of non-parametric, continuous causal estimators and derive quantum algorithms for these tasks.
  authors: Rishi Goel, Casey R Myers and Sally Shrapnel
  link:
    url: https://iopscience.iop.org/article/10.1088/2058-9565/ae20b8
    display: Quantum Sci. Technol. 11 015024 (2025)
  highlight: 1

- title: "A de Finetti theorem for quantum causal structures"
  image: images/papers/2025_Costa_deFenetti.png
  description: We extend de Finetti theorems for a mixture of states/channels to processes with arbitrary causal structure, including indefinite causal order and multi-time, non-Markovian processes applicable to noisy quantum devices. 
  authors:  Fabio Costa, Jonathan Barrett, and Sally Shrapnel
  link:
    url: https://doi.org/10.22331/q-2025-02-11-1628
    display: 	Quantum 9, 1628 (2025)
  highlight: 1

- title: "Quantum kernel machine learning with continuous variables"
  image: images/papers/2024_Henderson_Continous.png
  description: We derive a general closed form solution for all CV quantum kernels and show every such kernel can be expressed as the product of a Gaussian and an algebraic function of the parameters of the feature map. 
  authors:  Laura J Henderson, Rishi Goel and Sally Shrapnel
  link:
    url: https://doi.org/10.22331/q-2024-12-17-1570
    display: 	Quantum 8, 1570 (2024)
  highlight: 1

